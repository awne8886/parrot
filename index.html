<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parrot ASCII Art</title>
  <style>
    body { background: #000; color: #9f9; margin: 0; padding: 16px; }
    pre { font: 12px/1.1 monospace; }
  </style>
</head>
<body>
  <pre id="parrot-container"></pre>
  <script>
    const el = document.getElementById('parrot-container');
    fetch('/frames.json')
      .then((r) => r.json())
      .then(({ delay, frames }) => {
        let i = 0;
        setInterval(() => {
          el.textContent = frames[i];
          i = (i + 1) % frames.length;
        }, delay);
      })
      .catch(() => { el.textContent = 'Could not load the parrot.'; });
  </script>
</body>
</html>
